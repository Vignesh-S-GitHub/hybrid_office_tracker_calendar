name: Visual UI smoke preview
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/generated/**'
      - '.github/workflows/visual-preview.yml'
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Launch preview server and capture pages
        shell: bash
        run: |
          npm run preview -- --port 4173 --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/hybrid_office_tracker_calendar/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p screenshots
          for page in calendar holidays trains settings; do
            npx --yes playwright@1.58.2 screenshot --browser=chromium --viewport-size="390,844" --full-page "http://127.0.0.1:4173/hybrid_office_tracker_calendar/#$page" "screenshots/mobile-$page.png"
          done
          npx --yes playwright@1.58.2 screenshot --browser=chromium --viewport-size="1440,900" --full-page "http://127.0.0.1:4173/hybrid_office_tracker_calendar/#calendar" screenshots/desktop-calendar.png
      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-light-generated-screenshots
          path: screenshots/
          retention-days: 7
